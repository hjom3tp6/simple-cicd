# CI 會自動更新 image.tag 這個值
image:
  repository: ghcr.io/hjom3tp6/simple-cicd/myapp
  tag: "6939e6b319185b594433d49588dec85cd4430f47"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 80
  nodePort: 30080

ingress:
  enabled: false
  host: myapp.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Vault Agent Injector 設定
vault:
  enabled: true
  role: myapp
  secretPath: secret/data/myapp/config
  # Vault Agent 會把 secret 寫成這個模板格式
  # 產出 JSON 檔案，讓前端可以載入
  template: |
    {
      "API_KEY": "{{ with secret "secret/data/myapp/config" }}{{ .Data.data.API_KEY }}{{ end }}",
      "APP_ENV": "{{ with secret "secret/data/myapp/config" }}{{ .Data.data.APP_ENV }}{{ end }}",
      "DB_PASSWORD": "{{ with secret "secret/data/myapp/config" }}{{ .Data.data.DB_PASSWORD }}{{ end }}",
      "VAULT_DEMO": "{{ with secret "secret/data/myapp/config" }}{{ .Data.data.VAULT_DEMO }}{{ end }}"
    }
