name: Release - Promote to Prd

on:
  push:
    tags:
      - 'app-v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/myapp

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read dev image SHA and promote
        run: |
          DEV_TAG=$(yq '.image.tag' infra/helm/myapp/values-dev.yaml)
          echo "Promoting dev image: $DEV_TAG → ${{ github.ref_name }}"

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          crane tag "${IMAGE}:${DEV_TAG}" "${{ github.ref_name }}"
          crane tag "${IMAGE}:${DEV_TAG}" "latest"

      - name: Update prd image tag
        run: |
          yq -i '.image.tag = "${{ github.ref_name }}"' infra/helm/myapp/values-prd.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add infra/helm/myapp/values-prd.yaml
          git commit -m "chore(prd): release ${{ github.ref_name }}"
          git push origin main
