name: Release - Promote to Prd

on:
  push:
    tags:
      - 'app-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. app-v1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/myapp

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read dev image SHA and promote
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Read values-dev.yaml from the release tag commit (not current main HEAD)
          # This prevents accidentally promoting a newer SHA that was deployed after the release tag was created
          DEV_TAG=$(git show ${RELEASE_TAG}:infra/helm/myapp/values-dev.yaml | yq '.image.tag')
          echo "Promoting dev image: $DEV_TAG → $RELEASE_TAG"

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          crane tag "${IMAGE}:${DEV_TAG}" "$RELEASE_TAG"
          crane tag "${IMAGE}:${DEV_TAG}" "latest"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Update prd image tag
        run: |
          yq -i ".image.tag = \"$RELEASE_TAG\"" infra/helm/myapp/values-prd.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add infra/helm/myapp/values-prd.yaml
          git commit -m "chore(prd): release $RELEASE_TAG"
          git pull --rebase origin main
          git push origin main

      - name: Verify deployment (requires KUBECONFIG_B64 secret)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "⚠️  KUBECONFIG_B64 secret not configured — skipping deployment verification"
            echo "To enable: add a base64-encoded kubeconfig to repository secrets as KUBECONFIG_B64"
            exit 0
          fi
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "Waiting for deployment myapp-prd to become available..."
          kubectl wait --for=condition=available deployment/myapp-prd \
            -n prd --timeout=180s
          echo "✅ Deployment verified: myapp-prd is available in prd namespace"
