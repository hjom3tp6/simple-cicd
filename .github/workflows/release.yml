name: Release - Promote to Prd

on:
  push:
    tags:
      - 'app-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. app-v1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/myapp

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read dev image SHA and promote
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          DEV_TAG=$(yq '.image.tag' infra/helm/myapp/values-dev.yaml)
          echo "Promoting dev image: $DEV_TAG → $RELEASE_TAG"

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          crane tag "${IMAGE}:${DEV_TAG}" "$RELEASE_TAG"
          crane tag "${IMAGE}:${DEV_TAG}" "latest"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Update prd image tag
        run: |
          yq -i ".image.tag = \"$RELEASE_TAG\"" infra/helm/myapp/values-prd.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add infra/helm/myapp/values-prd.yaml
          git commit -m "chore(prd): release $RELEASE_TAG"
          git push origin main
